<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Streamer - Tower Control</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #12081a; color: #eee; padding: 24px; max-width: 480px; margin: 0 auto; }
    h1 { font-size: 1.2rem; margin-bottom: 16px; }
    label { display: block; margin-top: 12px; font-size: 12px; opacity: 0.85; }
    input, button { width: 100%; padding: 10px; margin-top: 6px; border-radius: 8px; border: 1px solid #444; background: #1e1428; color: #fff; }
    button { cursor: pointer; background: linear-gradient(135deg, #ff3b8d, #7b5cff); border: none; font-weight: 700; margin-top: 10px; }
    button:hover { filter: brightness(1.08); }
    .row { margin-bottom: 18px; padding-bottom: 18px; border-bottom: 1px solid #2a2035; }
    #out { margin-top: 16px; font-size: 12px; white-space: pre-wrap; color: #9fa; }
    .hint { font-size: 11px; opacity: 0.65; margin-top: 8px; }
  </style>
</head>
<body>
  <h1>Tower Battle - Streamer Panel</h1>
  <p class="hint">Default token: <code>admindev</code> - use <code>ADMIN_TOKEN</code> environment variable in production.</p>

  <div class="row">
    <label>Admin token</label>
    <input type="password" id="token" placeholder="admindev" autocomplete="off" />
  </div>

  <div class="row">
    <label>Extend match (extra time, ms)</label>
    <input type="number" id="extendMs" value="60000" min="10000" step="1000" />
    <button type="button" id="btnExtend">Extend time</button>
  </div>

  <div class="row">
    <label>Bot soldier (team)</label>
    <select id="botTeam" style="width:100%;padding:10px;margin-top:6px;border-radius:8px;background:#1e1428;color:#fff;border:1px solid #444;">
      <option value="red">Red</option>
      <option value="blue">Blue</option>
    </select>
    <input type="text" id="botName" placeholder="Name (optional)" maxlength="24" />
    <button type="button" id="btnBot">Send bot</button>
  </div>

  <div class="row">
    <label>Power mode duration (ms)</label>
    <input type="number" id="powerModeMs" value="60000" min="5000" step="1000" />
    <button type="button" id="btnPowerMode">Start power mode</button>
  </div>

  <div class="row">
    <button type="button" id="btnSudden">Final round (high impact) - manual</button>
  </div>

  <div id="out"></div>

  <script>
    const out = document.getElementById('out');
    function token() {
      return document.getElementById('token').value.trim() || 'admindev';
    }
    async function api(body) {
      const r = await fetch('/admin/api', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token() },
        body: JSON.stringify({ ...body, token: token() }),
      });
      const j = await r.json().catch(() => ({}));
      out.textContent = JSON.stringify(j, null, 2);
    }
    document.getElementById('btnExtend').onclick = () =>
      api({ action: 'extendMatch', ms: Number(document.getElementById('extendMs').value) || 60000 });
    document.getElementById('btnBot').onclick = () =>
      api({
        action: 'spawnBot',
        team: document.getElementById('botTeam').value,
        name: document.getElementById('botName').value || 'Destek Bot',
      });
    document.getElementById('btnPowerMode').onclick = () =>
      api({ action: 'powerMode', ms: Number(document.getElementById('powerModeMs').value) || 60000 });
    document.getElementById('btnSudden').onclick = () => api({ action: 'suddenDeath' });
  </script>
</body>
</html>
